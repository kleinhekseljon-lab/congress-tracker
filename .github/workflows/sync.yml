name: Sync Congress bills

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 1. Pull bill list from Congress.gov
        run: python scripts/fetch_bills.py

      - name: 2. Pull senators (weekly)
        run: python scripts/fetch_members.py
        continue-on-error: true

      - name: 3. Analyze bills (subjects, summaries, momentum)
        run: python scripts/enrich_bills.py

      - name: 4. Pull regulations from the Federal Register
        run: python scripts/fetch_regs.py
        continue-on-error: true

      - name: 5. Write plain-English summaries (needs ANTHROPIC_API_KEY)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ai_summaries.py
        continue-on-error: true

      - name: 6. Build the site
        run: python scripts/build_site.py

      - name: Save data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -q -m "Data sync $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -q origin main
          git push -q

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
